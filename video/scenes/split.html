<!doctype html>
<html><head><meta charset="utf-8"><title>Split</title>
<link rel="stylesheet" href="base.css">
<script src="../out/scene-icons.js"></script>
<style>
/* Background for the opening split: two phones (composited by ffmpeg) at x=420 and x=1036, 464x967, y=64. */
.shadow { position: absolute; top: 64px; width: 464px; height: 967px; border-radius: 64px; box-shadow: 0 40px 80px -30px rgba(10,20,40,.55), 24px 24px 0 rgba(29,95,196,.10); }
.side { position: absolute; top: 330px; width: 290px; display: grid; gap: 16px; }
.side.l { left: 100px; } .side.r { left: 1540px; }
.side .ico { width: 96px; height: 96px; border-radius: 24px; display: grid; place-items: center; font-size: 56px; }
.side.l .ico { background: #dff2e7; color: var(--ok); } .side.r .ico { background: var(--tag); color: var(--tag-ink); }
.side h3 { font-family: var(--f-display); font-weight: 900; font-size: 72px; text-transform: uppercase; margin: 0; line-height: .9; }
.side .lbl { font-family: var(--f-mono); font-size: 20px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.side .verdict { font-family: var(--f-mono); font-weight: 700; font-size: 22px; display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.side.l .verdict { color: var(--deny); } .side.r .verdict { color: var(--ok); }
.q { position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-family: var(--f-mono); font-size: 22px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
</style></head>
<body>
<div class="q">Same question · two helpers</div>
<div class="side l"><div class="ico"><i data-i="house"></i></div><div class="lbl">Homeowner's helper</div><h3>Juno</h3><div class="verdict"><i data-i="lock"></i>Crew only. Not shared.</div></div>
<div class="side r"><div class="ico"><i data-i="hardhat"></i></div><div class="lbl">Crew's helper</div><h3>Rex</h3><div class="verdict"><i data-i="check"></i>Answers, in Spanish</div></div>
<div class="shadow" style="left:420px"></div><div class="shadow" style="left:1036px"></div>
</body></html>
