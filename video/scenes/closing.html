<!doctype html>
<html><head><meta charset="utf-8"><title>Closing</title>
<link rel="stylesheet" href="base.css">
<style>
.center { position: absolute; left: 120px; right: 120px; top: 150px; bottom: 170px; display: grid; align-content: center; justify-items: start; gap: 30px; }
.mark { width: 120px; height: 120px; border: 10px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
.mark::after { content: ""; width: 38px; height: 38px; background: var(--tag); border-radius: 50%; border: 7px solid var(--ink); }
h1 { font-size: 230px; line-height: .82; }
.tagline { font-size: 46px; font-weight: 700; max-width: 30ch; line-height: 1.2; }
.links { display: grid; gap: 14px; margin-top: 16px; }
.url { font-family: var(--f-mono); font-weight: 700; font-size: 38px; color: var(--chalk); }
.repo { font-family: var(--f-mono); font-size: 32px; }
.stack { font-family: var(--f-mono); font-size: 22px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
</style></head>
<body>
<div class="center">
  <div style="display:flex;align-items:center;gap:40px" class="pop"><div class="mark"></div><h1>Crewbrain</h1></div>
  <div class="tagline up" style="animation-delay:.9s">A company brain with locks on it. Helpers that know only what they should, and end when the job ends.</div>
  <div class="links up" style="animation-delay:6.5s">
    <div class="url">https://macmini.tail435588.ts.net:10000/crewbrain/</div>
    <div class="repo">github.com/verkyyi/agent-creator</div>
  </div>
  <div class="stack in" style="animation-delay:8s">HydraDB · Claude · OpenAI gpt-realtime</div>
</div>
</body></html>
