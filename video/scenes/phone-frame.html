<!doctype html>
<html><head><meta charset="utf-8"><title>Phone frame</title>
<style>
/* Rendered with a transparent background: an opaque bezel with a transparent rounded screen hole.
   Outer 464x967, screen hole 432x935 at (16,16), radius 48. */
html, body { margin: 0; background: transparent; width: 464px; height: 967px; overflow: hidden; }
svg { display: block; }
</style></head>
<body>
<svg width="464" height="967" viewBox="0 0 464 967">
  <defs>
    <mask id="hole"><rect width="464" height="967" fill="white"/><rect x="16" y="16" width="432" height="935" rx="46" fill="black"/></mask>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a313b"/><stop offset=".5" stop-color="#0f1318"/><stop offset="1" stop-color="#2a313b"/></linearGradient>
  </defs>
  <rect width="464" height="967" rx="62" fill="url(#edge)" mask="url(#hole)"/>
  <rect x="3" y="3" width="458" height="961" rx="59" fill="none" stroke="#3b4450" stroke-width="2" mask="url(#hole)"/>
</svg>
</body></html>
