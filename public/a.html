<!doctype html>
<html lang="en">
<head>
<script>/* slash-fix */if(/\/crewbrain$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crewbrain helper</title>
<meta name="theme-color" content="#0b0e12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crewbrain">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="agent screen">
<header class="scr-head">
  <div class="avatar lg" id="h-avatar">·</div>
  <div class="scr-title"><b id="h-name">Loading…</b><span id="h-sub"></span></div>
</header>
<div class="expiry-bar" id="expiry-bar" hidden>
  <span class="tag" id="h-ends"><span class="hole"></span><span id="h-ends-text"></span></span>
  <span class="cando" id="h-cando"></span>
</div>

<main id="chat-main" class="chat-view">
  <div class="chat-scroll" id="chat" aria-live="polite"></div>
  <form class="composer" id="composer" autocomplete="off">
    <div class="attach-preview" id="attach-preview" hidden>
      <img id="attach-img" alt="Photo to send">
      <span>Photo attached</span>
      <button class="icon-btn" id="attach-clear" type="button" aria-label="Remove photo">✕</button>
    </div>
    <div class="voice-state" id="voice-state" hidden></div>
    <div class="comp-row">
      <button class="mic" id="mic-btn" type="button" aria-label="Talk" aria-pressed="false"></button>
      <div class="field-wrap">
        <input id="composer-input" type="text" enterkeyhint="send" placeholder="Ask anything…" aria-label="Message">
        <button class="icon-btn" id="attach-btn" type="button" aria-label="Attach a photo"></button>
        <button class="icon-btn send" id="send-btn" type="submit" aria-label="Send" disabled></button>
      </div>
      <input id="attach-input" type="file" accept="image/*" capture="environment" hidden>
    </div>
  </form>
</main>

<section class="ended-screen" id="ended-screen" hidden>
  <div class="off" id="ended-icon"></div>
  <div class="big" id="ended-title">This helper has ended</div>
  <p id="ended-text"></p>
</section>
<script type="module" src="agent.js"></script>
</body>
</html>
