<!doctype html>
<html lang="en">
<head>
<script>/* slash-fix */if(/\/crewbrain$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try Crewbrain</title>
<meta name="theme-color" content="#14181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body class="demo">
<header class="bar"><span class="brand"><span class="brand-mark" aria-hidden="true"></span>Crewbrain</span><span class="tenant"><b>Demo</b>for judges</span></header>
<div class="demo-wrap">
  <span class="tag" style="justify-self:start"><span class="hole"></span>Pick who you are</span>
  <h1>Try <span class="chalk">Crewbrain</span></h1>
  <p class="muted">Each button signs this browser in as one person. Start as Sam, the owner, then open the homeowner or crew link on another phone to see what they can — and can't — see.</p>
  <div id="ids" style="display:grid;gap:.75rem"><div class="reading"><div class="spinner"></div>Loading…</div></div>
</div>
<script type="module">
import { api, h } from "./common.js";
const ROLE = { owner: "🧰", customer: "🏡", crew: "🦺" };
const el = document.getElementById("ids");
const r = await api("api/demo/identities");
el.innerHTML = "";
const ids = (r.ok && r.data.identities) || [];
if (!ids.length) el.append(h("div", { class: "empty" }, "Demo identities aren't available right now."));
for (const i of ids) {
  const icon = ROLE[i.role] || (/crew|roof/i.test(i.name + i.description) ? "🦺" : "🏡");
  el.append(h("a", { class: "id-btn", href: i.url, "data-role": i.role, "data-testid": "identity" },
    h("span", { class: "avatar lg light role" }, i.role === "owner" ? "🧰" : icon),
    h("b", {}, i.name),
    h("span", { class: "go", "aria-hidden": "true" }, "→"),
    h("span", { class: "d" }, i.description || i.role)));
}
</script>
</body>
</html>
