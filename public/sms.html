<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMS Simulator</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--paper); color: var(--ink); font-family: var(--f-body); margin: 0; }
  .sim { max-width: 980px; margin: 0 auto; padding: 16px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
  @media (max-width: 760px) { .sim { grid-template-columns: 1fr; } }
  .side h1 { font-family: var(--f-display); font-size: 2rem; margin: 0 0 .25rem; letter-spacing: .02em; }
  .side p { color: var(--muted); line-height: 1.45; margin: .4rem 0; }
  .who { display: grid; gap: 6px; margin-top: 12px; }
  .who button { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; cursor: pointer; }
  .who button[aria-pressed="true"] { border-color: var(--chalk); box-shadow: 0 0 0 2px var(--chalk-soft); }
  .who small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: .78rem; }
  .who button:disabled { opacity: .5; cursor: not-allowed; }
  .mode { font-family: var(--f-mono); font-size: .8rem; padding: 2px 8px; border-radius: 99px; background: var(--chalk-soft); color: var(--ink); display: inline-block; }
  .phone { background: var(--phone); color: var(--phone-fg); border-radius: 36px; padding: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); height: min(720px, 86vh); display: flex; flex-direction: column; }
  .phone header { text-align: center; padding: 8px 0 10px; border-bottom: 1px solid var(--screen-line); }
  .phone header b { display: block; }
  .phone header small { color: var(--screen-muted); font-family: var(--f-mono); font-size: .75rem; }
  .thread { flex: 1; overflow-y: auto; padding: 12px 4px; display: flex; flex-direction: column; gap: 6px; }
  .b { max-width: 80%; padding: 8px 12px; border-radius: 18px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
  .b.me { align-self: flex-end; background: #2f9e44; color: #fff; border-bottom-right-radius: 4px; }
  .b.them { align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 4px; }
  .b.note { align-self: center; background: transparent; color: var(--screen-muted); font-size: .75rem; padding: 2px; }
  .b img { max-width: 100%; border-radius: 10px; display: block; }
  .meta { font-size: .68rem; color: var(--screen-muted); margin-top: 2px; }
  form { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid var(--screen-line); align-items: center; }
  form input[type=text] { flex: 1; min-width: 0; border-radius: 99px; border: 1px solid var(--screen-line); background: var(--field); color: var(--phone-fg); padding: 10px 14px; font: inherit; }
  form button, form label { border: 0; border-radius: 99px; background: #2f9e44; color: #fff; padding: 10px 14px; font: inherit; cursor: pointer; }
  form label { background: var(--bubble-in); }
  form button:disabled { opacity: .5; }
  .tries { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tries button { border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 99px; padding: 6px 10px; font: inherit; font-size: .85rem; cursor: pointer; }
</style>
</head>
<body>
<main class="sim">
  <section class="side">
    <h1>SMS simulator</h1>
    <p>Text a helper as one of your people, without a phone. Messages go through the same handler as real texts to the CrewBrain number (every access rule applies), minus the Twilio signature.</p>
    <p><span class="mode" id="mode">…</span></p>
    <div class="who" id="who" role="group" aria-label="Text as"></div>
    <div class="tries" id="tries" aria-label="Try"></div>
    <p><a href="./">Back to CrewBrain</a></p>
  </section>
  <section class="phone" aria-label="Phone">
    <header><b id="to">CrewBrain</b><small id="from">pick a person</small></header>
    <div class="thread" id="thread" aria-live="polite"></div>
    <form id="f">
      <label title="Attach a photo (MMS)">📎<input type="file" accept="image/*" id="pic" hidden></label>
      <input type="text" id="msg" placeholder="Text message" autocomplete="off" aria-label="Text message">
      <button id="send" type="submit">Send</button>
    </form>
  </section>
</main>
<script type="module" src="sms.js"></script>
</body>
</html>
